<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Apex Circuit — model inspector</title>
<style>
  body { margin:0; overflow:hidden; background:#202830; font-family: system-ui; }
  #ui { position:fixed; top:10px; left:10px; z-index:10; background:rgba(0,0,0,.6); color:#cfe; padding:10px 12px; font-size:12px; border-radius:8px; max-width:340px; }
  #ui b { color:#fff; }
  #info { color:#8f8; white-space:pre-wrap; }
  label { display:block; margin:3px 0; cursor:pointer; }
</style>
</head>
<body>
<div id="ui">
  <b id="title">MODEL INSPECTOR</b>
  <div id="info">loading…</div>
  <label><input type="checkbox" id="cb-props"> show props (buckets/backdrop)</label>
  <label><input type="checkbox" id="cb-wire"> wireframe</label>
  <label><input type="checkbox" id="cb-grid" checked> grid</label>
  <label><input type="checkbox" id="cb-steer"> steer test (0.4 rad)</label>
  <label><input type="checkbox" id="cb-spin"> spin test</label>
  <label><input type="checkbox" id="cb-axes"> wheel axes</label>
  <label><input type="checkbox" id="cb-int"> overlay interior</label>
  <label><input type="checkbox" id="cb-emissive" checked> lights emissive</label>
  <label>paint: <select id="paint">
    <option value="0xb0121a">Guards Red</option>
    <option value="0xd8d9db">GT Silver</option>
    <option value="0x0f1a2e">Night Blue</option>
    <option value="0xe0c310">Speed Yellow</option>
    <option value="0x0c0d10">Jet Black</option>
    <option value="0x1c5c34">Irish Green</option>
  </select></label>
</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const qs = new URLSearchParams(location.search);
const which = qs.get('model') || 'car';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x202830);
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.05, 500);
camera.position.set(6, 3, 6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.setTarget ? null : null;

scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x30281a, 1.1));
const dl = new THREE.DirectionalLight(0xffffff, 2.2);
dl.position.set(5, 8, 4);
dl.castShadow = true;
scene.add(dl);
const grid = new THREE.GridHelper(20, 40, 0x446, 0x334);
scene.add(grid);

const axesCache = [];
const info = [];
window.__state = { wheels: [], spinOn: false, steerOn: false };

function box3Helper(obj, color = 0xff00ff) {
  const b = new THREE.Box3().setFromObject(obj);
  const h = new THREE.Box3Helper(b, color);
  return h;
}

function wheelAxes(list) {
  axesCache.forEach(a => scene.remove(a));
  axesCache.length = 0;
  for (const w of list) {
    const g = new THREE.AxesHelper(0.45);
    g.position.copy(w.center);
    axesCache.push(g);
    scene.add(g);
  }
}

if (which === 'car') {
  const loader = new GLTFLoader();
  loader.load('/models/porsche_911.glb', (gltf) => {
    document.getElementById('info').textContent = 'parsing scene…';
    const root = gltf.scene;
    scene.add(root);
    root.updateMatrixWorld(true);

    // report bounds
    const bb = new THREE.Box3().setFromObject(root);
    info.push(`raw bounds: min=${bb.min.toArray().map(v=>v.toFixed(2))} max=${bb.max.toArray().map(v=>v.toFixed(2))}`);
    info.push(`size: ${bb.getSize(new THREE.Vector3()).toArray().map(v=>v.toFixed(2))}`);

    // list nodes
    root.traverse(o => { if (o.isMesh) info.push(`${o.name} [${(o.material&&o.material.name)||'?'}]`); });

    // hide props
    const PROP_RE = /^(Plane\.002|Plane\.003|Plane\.004|Plane$|Cube\.001|Hemi)/;
    const props = [];
    root.traverse(o => {
      const n = o.name;
      if (PROP_RE.test(n)) { props.push(o); o.visible = false; }
      if (o.isMesh) {
        const p = n.startsWith('Hemi');
        if (p) o.visible = false;
      }
    });
    window.__props = props;

    // ---- find axle nodes (GLTFLoader strips dots from names) ----
    try {
    const axles = {};
    root.traverse(o => {
      if (!o.isMesh && o.name.startsWith('Cylinder000')) axles.rear = o;
      if (!o.isMesh && o.name.startsWith('Cylinder001')) axles.front = o;
    });
    info.push(`axles found: ${Object.keys(axles).join(',')} rear=${axles.rear && axles.rear.name} front=${axles.front && axles.front.name}`);
    if (axles.rear) info.push(`rear kids: ${axles.rear.children.map(c=>c.name+'('+(c.material&&c.material.name)+')').join(' ')}`);
    if (axles.front) info.push(`front kids: ${axles.front.children.map(c=>c.name+'('+(c.material&&c.material.name)+')').join(' ')}`);

    // split each axle into left/right halves -> 4 independent wheels
    const inv = new THREE.Matrix4().copy(root.matrixWorld).invert();
    const wheels = [];
    for (const [key, axle] of Object.entries(axles)) {
      const meshes = [];
      axle.updateMatrixWorld(true);
      axle.traverse(o => { if (o.isMesh) meshes.push(o); });
      // axle center: rubber (tire) mesh world origin, expressed in root-local space
      let tireMesh = null;
      axle.traverse(o => { if (o.isMesh && o.material && o.material.name === 'rubber') tireMesh = o; });
      const centerLocal = new THREE.Vector3().setFromMatrixPosition(tireMesh.matrixWorld).applyMatrix4(inv);
      info.push(`${key} center(local): ${centerLocal.toArray().map(v=>v.toFixed(3))}`);

      for (const side of [1, -1]) {
        const wheelRoot = new THREE.Group();
        wheelRoot.name = `wheel_${key}_${side>0?'R':'L'}`;
        const steer = new THREE.Group();
        const susp = new THREE.Group();
        const spin = new THREE.Group();
        wheelRoot.add(steer); steer.add(susp); susp.add(spin);

        // first pass: split all parts, keep absolute-space geometries
        const halves = [];
        for (const mesh of meshes) {
          const g = toFloat32Geometry(mesh.geometry);      // dequantize -> float32 (non-indexed)
          g.applyMatrix4(new THREE.Matrix4().multiplyMatrices(inv, mesh.matrixWorld));
          const pos = g.attributes.position;
          const keep = new Array(pos.count);
          for (let i = 0; i < pos.count; i++) keep[i] = (pos.getX(i) * side) > -0.001;
          const g2 = keepSomeFromBaked(g, keep);
          if (!g2) continue;
          halves.push({ g2, mat: mesh.material, isCaliper: mesh.material.name === 'Material.001' });
        }
        // wheel center x: centroid of the rubber half
        let xHalf = centerLocal.x;
        const rub = halves.find(h => h.mat.name === 'rubber');
        if (rub) {
          rub.g2.computeBoundingBox();
          xHalf = (rub.g2.boundingBox.min.x + rub.g2.boundingBox.max.x) / 2;
        }
        wheelRoot.position.set(xHalf, centerLocal.y, centerLocal.z);
        for (const h of halves) {
          const mm = new THREE.Mesh(h.g2, h.mat);
          mm.castShadow = true;
          mm.position.set(-xHalf, -centerLocal.y, -centerLocal.z); // relative to wheel pivot
          if (h.isCaliper) steer.add(mm); else spin.add(mm);
        }
        root.add(wheelRoot);
        wheels.push({ root: wheelRoot, steer, susp, spin, key, side, center: wheelRoot.position.clone(), xHalf });
      }
      // hide original axle
      axle.visible = false;
    }

    window.__state.wheels = wheels;
    info.push(`wheels: ${wheels.map(w=>`${w.key}:${w.side>0?'R':'L'}@x${w.xHalf.toFixed(2)}`).join(' ')}`);
    } catch (e) {
      info.push('AXLE ERROR: ' + e.message + ' @ ' + (e.stack||'').split('\n')[1]);
    }
    document.getElementById('info').textContent = info.join('\n');
    window.__car = root;
    window.__ready = true;
  });
}

/** Convert any (possibly quantized/normalized/interleaved) attributes to plain Float32. */
function toFloat32Geometry(g) {
  let src = g.index ? g.toNonIndexed() : g.clone();
  for (const name of Object.keys(src.attributes)) {
    const attr = src.attributes[name];
    const n = attr.count, item = attr.itemSize;
    const arr = new Float32Array(n * item);
    for (let i = 0; i < n; i++) {
      for (let c = 0; c < item; c++) arr[i * item + c] = attr[`get${'XYZW'[c]}`](i);
    }
    src.setAttribute(name, new THREE.BufferAttribute(arr, item));
  }
  return src;
}

/** Keep triangles of an already-dequantized, non-indexed, baked geometry (>=2 of 3 verts pass keep[]). */
function keepSomeFromBaked(src, keep) {
  const pos = src.attributes.position;
  const keepTris = [];
  for (let t = 0; t < pos.count / 3; t++) {
    const a = t * 3;
    const vote = (keep[a] ? 1 : 0) + (keep[a + 1] ? 1 : 0) + (keep[a + 2] ? 1 : 0);
    if (vote >= 2) keepTris.push(t);
  }
  if (!keepTris.length) return null;
  const out = new THREE.BufferGeometry();
  const newCount = keepTris.length * 3;
  for (const name of Object.keys(src.attributes)) {
    const attr = src.attributes[name];
    const arr = new attr.array.constructor(newCount * attr.itemSize);
    let o = 0;
    for (const t of keepTris) {
      for (let v = 0; v < 3; v++) {
        const i = t*3 + v;
        for (let c = 0; c < attr.itemSize; c++) arr[o++] = attr.array[i * attr.itemSize + c];
      }
    }
    out.setAttribute(name, new THREE.BufferAttribute(arr, attr.itemSize));
  }
  return out;
}

// ---- interior overlay ----
if (qs.get('int') === '1') {
  const loader = new GLTFLoader();
  loader.load('/models/interior.glb', (gltf) => {
    const s = gltf.scene;
    s.updateMatrixWorld(true);
    const bb = new THREE.Box3().setFromObject(s);
    const size = bb.getSize(new THREE.Vector3());
    info.push(`interior raw size: ${size.toArray().map(v=>v.toFixed(2))} min=${bb.min.toArray().map(v=>v.toFixed(1))}`);
    // normalize: uniform scale so the LARGEST dim = 4.6 (car-ish), center on origin, floor at y=0
    const sc = 4.6 / Math.max(size.x, size.y, size.z);
    s.scale.setScalar(sc);
    s.updateMatrixWorld(true);
    const bb2 = new THREE.Box3().setFromObject(s);
    const c2 = bb2.getCenter(new THREE.Vector3());
    s.position.x -= c2.x; s.position.z -= c2.z; s.position.y -= bb2.min.y;
    s.updateMatrixWorld(true);
    scene.add(s);
    window.__int = s;
    window.__ready = true;
    info.push(`interior scaled by ${sc.toFixed(4)} — inspect orientation vs car (nose +Z)`);
    document.getElementById('info').textContent = info.slice(-2).join('\n');
  });
}

if (which === 'tree') {
  const loader = new GLTFLoader();
  loader.load('/models/tree.glb', (gltf) => {
    const s = gltf.scene;
    scene.add(s);
    s.updateMatrixWorld(true);
    const bb = new THREE.Box3().setFromObject(s);
    info.push(`tree bounds: min=${bb.min.toArray().map(v=>v.toFixed(2))} max=${bb.max.toArray().map(v=>v.toFixed(2))}`);
    info.push(`size: ${bb.getSize(new THREE.Vector3()).toArray().map(v=>v.toFixed(2))}`);
    s.traverse(o => { if (o.isMesh) info.push(`${o.name} [${o.material.name}] tex=${!!(o.material.map)}`); });
    document.getElementById('info').textContent = info.join('\n');
    window.__tree = s;
    window.__ready = true;
  });
}

// ---- UI ----
const cbProps = document.getElementById('cb-props');
const cbWire = document.getElementById('cb-wire');
const cbGrid = document.getElementById('cb-grid');
const cbSteer = document.getElementById('cb-steer');
const cbSpin = document.getElementById('cb-spin');
const cbAxes = document.getElementById('cb-axes');
const cbInt = document.getElementById('cb-int');
const cbEmis = document.getElementById('cb-emissive');
const paintSel = document.getElementById('paint');
cbProps.onchange = () => window.__props && window.__props.forEach(o => o.visible = cbProps.checked);
cbWire.onchange = () => scene.traverse(o => { if (o.isMesh) o.material.wireframe = cbWire.checked; });
cbGrid.onchange = () => grid.visible = cbGrid.checked;
cbAxes.onchange = () => axesCache.forEach(a => a.visible = cbAxes.checked);
cbInt.onchange = () => { if (window.__int) window.__int.visible = cbInt.checked; };
cbEmis.onchange = () => {
  scene.traverse(o => {
    if (o.isMesh && o.material && (o.material.name === 'lights' || o.material.name === 'tex_shiny')) {
      o.material.emissive = new THREE.Color(cbEmis.checked ? (o.material.name === 'lights' ? 0xfff6d8 : 0xff2222) : 0x000000);
      o.material.emissiveIntensity = cbEmis.checked ? 3 : 0;
    }
  });
};
paintSel.onchange = () => {
  scene.traverse(o => {
    if (o.isMesh && o.material && o.material.name === 'paint') {
      o.material.color = new THREE.Color(parseInt(paintSel.value));
    }
  });
};

const clock = new THREE.Clock();
let spinA = 0;

// named camera angles for the screenshot harness
window.camera = camera;
window.controls = controls;
window.scene = scene;
window.THREE = THREE;
window.__angles = {
  front: "() => { camera.position.set(0, 0.8, 6.2); controls.target.set(0, 0, 0); controls.update(); }",
  side: "() => { camera.position.set(6.2, 0.9, 0); controls.target.set(0, 0, 0); controls.update(); }",
  rear3q: "() => { camera.position.set(-4.2, 1.6, -4.6); controls.target.set(0, 0, 0); controls.update(); }",
  front3q: "() => { camera.position.set(3.8, 1.4, 4.6); controls.target.set(0, 0, 0); controls.update(); }",
  top: "() => { camera.position.set(0.01, 7.5, 0.01); controls.target.set(0, 0, 0); controls.update(); }",
  wheelFL: "() => { camera.position.set(-2.6, 0.4, 3.1); controls.target.set(-0.78, -0.30, 1.27); controls.update(); }",
  wheelFR: "() => { camera.position.set(2.6, 0.4, 3.1); controls.target.set(0.78, -0.30, 1.27); controls.update(); }",
  wheelRL: "() => { camera.position.set(-2.6, 0.5, -3.2); controls.target.set(-0.77, -0.30, -1.17); controls.update(); }",
  cockpit: "() => { camera.position.set(-0.5, 1.1, 0.4); controls.target.set(1.6, 0.5, -0.5); controls.update(); }",
};
function loop() {
  requestAnimationFrame(loop);
  const dt = clock.getDelta();
  if (window.__state.steerOn || cbSteer.checked) {
    window.__state.wheels.forEach(w => { if (w.key === 'front') w.steer.rotation.y = 0.4; });
  } else {
    window.__state.wheels.forEach(w => { w.steer.rotation.y = 0; });
  }
  if (cbSpin.checked) {
    spinA -= dt * 6;
    window.__state.wheels.forEach(w => { w.spin.rotation.x = spinA; });
  }
  controls.update();
  renderer.render(scene, camera);
}
loop();
window.addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
