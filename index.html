<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f14" />
  <meta name="description" content="APEX DRIFT — a mobile-first seeded drift game. Procedurally generated drift parks with painted drift zones, handbrake physics and combo scoring. Fully offline-installable PWA." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Apex Drift" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="apple-touch-fullscreen" content="yes" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-512.png" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <title>APEX DRIFT — Seeded Drift Park</title>
  <style>
    /* Critical inline styles so the loading screen looks right before CSS arrives */
    html, body { margin: 0; padding: 0; background: #0b0f14; overflow: hidden; height: 100%; overscroll-behavior: none; touch-action: none; }
    #app { position: fixed; inset: 0; }
    #app canvas { display: block; }
    .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 40; }
    #loading-screen { background: radial-gradient(120% 120% at 50% 30%, #1b1520 0%, #0b0f14 70%); color: #dfe9f3; font-family: system-ui, sans-serif; }
    .spinner { width: 46px; height: 46px; border-radius: 50%; border: 4px solid rgba(255,255,255,.14); border-top-color: #ff3b30; animation: spin 0.9s linear infinite; margin-bottom: 18px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- WebGL canvas is injected here -->
  <div id="app" aria-label="Game canvas"></div>

  <!-- HUD (built dynamically by ui/HUD.js) -->
  <div id="hud-root" style="display:none"></div>

  <!-- Touch controls (built dynamically by ui/TouchControls.js) -->
  <div id="touch-root" style="display:none"></div>

  <!-- Menu overlays (start / pause, built by ui/Menu.js) -->
  <div id="menu-root"></div>

  <!-- Loading -->
  <div id="loading-screen" class="screen">
    <div class="spinner"></div>
    <div id="loading-label" style="font-size:15px; letter-spacing:4px; font-weight:600;">LOADING CAR…</div>
    <div style="width:min(420px, 70vw); height:4px; border-radius:2px; background:rgba(255,255,255,.12); margin-top:16px; overflow:hidden;">
      <div id="loading-bar" style="width:0%; height:100%; background:linear-gradient(90deg,#ff3b30,#ff9d14); transition:width .25s ease;"></div>
    </div>
    <div style="margin-top:12px; font-size:11px; letter-spacing:2px; color:rgba(255,255,255,.45);">APEX DRIFT</div>
  </div>

  <!-- Error overlay -->
  <div id="error-overlay" class="screen" style="display:none; background: rgba(8,10,14,0.96); z-index: 60;">
    <div class="error-panel">
      <h2 style="margin:0 0 10px; font-size:22px; color:#ff6b61;">Something went wrong</h2>
      <p id="error-message" style="margin:0 0 8px; line-height:1.5;">Unknown error</p>
      <p id="error-hint" style="margin:0; opacity:.75; font-size:13px; line-height:1.5;"></p>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
